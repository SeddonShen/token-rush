<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Rush 推理优化课程 · 35 步 × 18 概念</title>
<style>
  :root {
    --paper:#f6f4ec; --card:#fffdf7; --ink:#171610; --ink2:#504e42; --muted:#8a8779;
    --line:#d9d5c7; --line2:#c5c0ae;
    --blue:#1c5d99; --orange:#c65417; --green:#177a56; --purple:#6b5aa8; --red:#b3402e;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.9;font-size:16.5px;
    font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue)}
  code{background:#efece1;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:14px;font-family:var(--mono)}
  .mono{font-family:var(--mono);letter-spacing:.08em}
  /* ---------- 顶栏 ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);
    display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:0 max(24px, calc((100% - 1280px)/2));height:54px}
  .topbar .brand{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.02em}
  .topbar .brand i{color:var(--orange);font-style:normal}
  .topbar a{color:#cfccbd;text-decoration:none;font-size:14px;padding:4px 2px;border-bottom:2px solid transparent}
  .topbar a:hover{color:#fff;border-bottom-color:var(--orange)}
  .topbar .crumb{margin-left:auto;font-size:12.5px;color:#96937f;font-family:var(--mono)}
  .topbar .crumb a{color:#b9b6a6;font-size:12.5px;border:none}
  /* ---------- 版式 ---------- */
  .frame{max-width:1280px;margin:0 auto;padding:0 24px}
  .narrow{max-width:860px;margin:0 auto}
  /* ---------- 首页 hero ---------- */
  .hero{border-bottom:2px solid var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(23,22,16,.045) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(23,22,16,.045) 31px 32px),
      var(--paper)}
  .hero .frame{padding-top:58px;padding-bottom:46px}
  .kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.22em;color:var(--orange);font-weight:700}
  .hero h1{font-family:var(--serif);font-size:clamp(34px,4.6vw,54px);line-height:1.22;margin:10px 0 4px;font-weight:900;letter-spacing:.01em}
  .hero h1 em{font-style:normal;color:var(--blue)}
  .hero .sub{max-width:760px;color:var(--ink2);font-size:17px;margin:10px 0 0}
  .statrow{display:flex;flex-wrap:wrap;margin-top:30px;border:1.5px solid var(--ink);background:var(--card)}
  .statrow .stat{flex:1 1 170px;padding:14px 20px;border-right:1px solid var(--line2)}
  .statrow .stat:last-child{border-right:none}
  .stat .v{font-family:var(--serif);font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .v.o{color:var(--orange)} .stat .v.b{color:var(--blue)}
  .stat .k{font-size:12.5px;color:var(--muted);margin-top:2px}
  .formula{margin-top:26px;border:1.5px solid var(--ink);border-left:7px solid var(--blue);background:var(--card);padding:16px 24px;max-width:860px}
  .formula .f{font-family:var(--mono);font-size:16.5px;background:none;border:none;padding:0}
  /* ---------- 区段 ---------- */
  h2.sec{display:flex;align-items:baseline;gap:14px;font-family:var(--serif);font-size:30px;font-weight:900;
    margin:64px 0 6px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
  h2.sec .no{font-family:var(--mono);font-size:13px;color:var(--orange);letter-spacing:.2em}
  .phase-desc{color:var(--ink2);margin:8px 0 20px;max-width:820px}
  .phaseband{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--paper);
    margin:46px 0 16px;padding:10px 18px}
  .phaseband .pn{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#e8a87c}
  .phaseband .pt{font-family:var(--serif);font-size:20px;font-weight:700}
  .phaseband .pd{margin-left:auto;font-size:13px;color:#b8b5a5;max-width:520px;text-align:right}
  @media (max-width:820px){.phaseband .pd{display:none}}
  /* ---------- 步骤卡双栏 ---------- */
  .stepgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:860px){.stepgrid{grid-template-columns:1fr}}
  .stepcard{position:relative;display:flex;gap:18px;background:var(--card);border:1px solid var(--line2);
    padding:18px 20px 16px;text-decoration:none;color:var(--ink);transition:transform .12s, border-color .12s}
  .stepcard:hover{border-color:var(--ink);transform:translateY(-2px)}
  .stepcard .nn{flex:0 0 46px;font-family:var(--serif);font-size:34px;font-weight:900;color:var(--line2);line-height:1;
    font-variant-numeric:tabular-nums;transition:color .12s}
  .stepcard:hover .nn{color:var(--orange)}
  .stepcard .tt{font-family:var(--serif);font-size:18.5px;font-weight:700;line-height:1.4}
  .stepcard .tg{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.65}
  .stepcard .badge{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 7px}
  .stepcard .badge.major{color:#fff;background:var(--blue);border-color:var(--blue)}
  .stepcard .badge.mid{color:var(--blue);border-color:var(--blue)}
  /* ---------- 概念卡 ---------- */
  .conceptgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:1000px){.conceptgrid{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){.conceptgrid{grid-template-columns:1fr}}
  .conceptcard{background:var(--card);border:1px solid var(--line2);border-top:4px solid var(--green);
    padding:15px 18px 13px;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
  .conceptcard:hover{border-color:var(--green);transform:translateY(-2px)}
  .conceptcard .t{font-family:var(--serif);font-size:17px;font-weight:700}
  .conceptcard .o{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.65}
  /* ---------- 课页 ---------- */
  .lesson{background:var(--card);border:1.5px solid var(--ink);margin:34px 0 0}
  .lesson .head{padding:30px 40px 22px;border-bottom:2px solid var(--ink);position:relative;overflow:hidden}
  .lesson .head .wm{position:absolute;right:18px;top:-32px;font-family:var(--serif);font-size:150px;font-weight:900;
    color:rgba(23,22,16,.055);line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}
  .lesson .kicker{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:12.5px}
  .lesson .kicker .ph{color:var(--blue);font-weight:700;letter-spacing:.14em}
  .lesson .kicker .badge{border:1px solid var(--line2);border-radius:3px;padding:1px 8px;color:var(--muted);letter-spacing:.12em}
  .lesson h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:900;margin:10px 0 2px;line-height:1.3}
  .lesson .tagline{font-size:17px;color:var(--ink2);margin-top:6px;max-width:720px}
  .lesson .body{padding:26px 40px 30px}
  @media (max-width:640px){.lesson .head{padding:22px 20px}.lesson .body{padding:20px 20px 26px}}
  .lesson h4{display:flex;align-items:center;gap:10px;margin:34px 0 10px;font-family:var(--serif);
    font-size:19px;font-weight:900}
  .lesson h4 .no{font-family:var(--mono);font-size:11.5px;color:var(--orange);letter-spacing:.18em;font-weight:700}
  .lesson h4::after{content:"";flex:1;border-top:1px solid var(--line)}
  .lesson p{margin:10px 0;color:#26251e}
  .nums{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
  .num{border:1px solid var(--line2);border-radius:3px;padding:4px 12px;font-size:14px;background:var(--paper)}
  .num b{font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:700}
  .num.hl{border-color:var(--green);background:#eef5ef}
  .box{border:1px solid var(--line2);border-radius:3px;padding:15px 20px;margin:16px 0;background:var(--paper)}
  .box .lab{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.2em;margin-bottom:6px}
  .box.analogy{border-left:5px solid var(--green);background:#f1f6f0} .box.analogy .lab{color:var(--green)}
  .box.worked{border-left:5px solid #9a7d2e;background:#f8f4e6} .box.worked .lab{color:#9a7d2e}
  .box.mis{border-left:5px solid var(--red);background:#f9efec} .box.mis .lab{color:var(--red)}
  .box.a800b{border-left:5px solid var(--orange);background:#f9f1e8} .box.a800b .lab{color:var(--orange)}
  .box.exercise{border-left:5px solid var(--purple);background:#f4f2f9} .box.exercise .lab{color:var(--purple)}
  .box.refs{border-left:5px solid var(--blue);background:#eef2f7} .box.refs .lab{color:var(--blue)}
  .chips{margin:10px 0 0}
  .chip{display:inline-block;font-size:12.5px;color:var(--blue);background:#eef2f7;border:1px solid #c8d6e5;
    border-radius:3px;padding:2px 11px;margin:3px 6px 3px 0;text-decoration:none}
  .chip:hover{background:var(--blue);color:#fff}
  .chip.green{color:var(--green);background:#eef5ef;border-color:#bed9c9}
  .chip.green:hover{background:var(--green);color:#fff}
  .prenext{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
  .prenext a{flex:1 1 220px;background:var(--paper);border:1px solid var(--line2);border-radius:3px;
    padding:12px 18px;text-decoration:none;color:var(--ink);font-size:14.5px}
  .prenext a:hover{border-color:var(--ink)}
  .prenext .dir{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em}
  .diagram{margin:18px 0;border:1px solid var(--line2);border-radius:3px;background:#fff;padding:12px}
  .diagram svg{width:100%;height:auto;display:block}
  .diagram .cap{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 6px 2px;border-top:1px dashed var(--line);margin-top:8px}
  .prereq{font-size:13.5px;color:var(--muted);margin:6px 0 0}
  .pathbox{background:var(--card);border:1px solid var(--line2);border-left:6px solid var(--blue);
    border-radius:3px;padding:18px 26px;margin:16px 0}
  .pathbox ol{margin:10px 0 4px;padding-left:22px}
  .pathbox li{margin:6px 0}
  #chartbox{border:1.5px solid var(--ink);background:var(--card);margin-top:34px;padding:16px 16px 10px}
  #chart{width:100%;height:auto;display:block}
  .legend{font-size:13px;color:var(--ink2);display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:8px 0 4px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .ring{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2.5px solid var(--orange)}
  .refs-list{margin:8px 0 2px;padding-left:0;list-style:none;counter-reset:ref}
  .refs-list li{counter-increment:ref;margin:9px 0;padding-left:34px;position:relative;line-height:1.7}
  .refs-list li::before{content:"["counter(ref,decimal-leading-zero)"]";position:absolute;left:0;top:2px;
    font-family:var(--mono);font-size:12px;color:var(--muted)}
  .refs-list .rt{font-weight:600}
  .refs-list .rn{display:block;font-size:13px;color:var(--ink2)}
  .refs-list.bili li::before{content:"TV";color:var(--orange);font-weight:700;font-size:11px;letter-spacing:.05em}
  footer{margin-top:70px;border-top:2px solid var(--ink);padding:22px 0 46px;color:var(--muted);font-size:14px}
  footer .frame{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
</style>
</head>

  <span class="crumb" id="crumb"></span>
</nav>
<div id="app"></div>
<footer><div class="frame">
  <span>内容改写自仓库 docs/progress.md 的逐课解读，数字均为原日志实测；A800 数字为本机实测（docs/a800.md）。</span>
  <span>零依赖可离线 · 数据在 concepts.js / steps.js · <a href="../steps_zh.html">旧版总览</a></span>
</div></footer>

<script src="concepts.js"></script>
<script src="steps.js"></script>
<script>
/* ================= 图解库 ================= */
const D = {};
D.wall = () => {
  let s = svgOpen(1040,300);
  s += box(30,40,190,95,"#171610","#f6f4ec","权重 int4","14.3 GB/步");
  s += box(30,155,190,95,"#8a8779","#fff","KV 缓存","随上下文涨");
  s += arrow(240,92,350,92,"每步全量读","#1c5d99");
  s += box(360,56,160,72,"#1c5d99","#fff","计算单元","（算力大量闲置）");
  s += text(560,80,"tok/s 上限 = 实测带宽 ÷ 每步字节","#171610",16,900);
  s += text(560,112,"A800：1902 ÷ 14.3 ≈ 133 tok/s","#c65417",14.5,700);
  s += text(560,140,"5090：1701 ÷ 13.7 ≈ 124 tok/s","#504e42",13.5,400);
  s += text(30,280,"显存带宽是墙：batch=1 时算力闲置，速度由“每步必须读的字节”决定","#8a8779",13,400);
  return s + "</svg>";
};
D.launch = () => {
  let s = svgOpen(1040,330);
  s += text(30,32,"eager：CPU 每次发射一个 kernel，GPU 大半时间在等指令","#171610",14.5,700);
  for (let i=0;i<15;i++) s += box(30+i*38,44,30,26,"#c5c0ae","#171610","","");
  s += text(620,62,"… × 2500 次","#8a8779",12.5,400);
  s += bar(30,84,760,26,"#f0e0d8","CPU 发射 30 ms");
  s += bar(30,118,330,26,"#d9e4ef","GPU 实算 18 ms（其余空等）");
  s += text(30,196,"CUDA graph：整步录成一张图，一条 replay","#171610",14.5,700);
  s += bar(30,208,40,26,"#1c5d99","replay");
  s += bar(30,242,360,26,"#d9e4ef","GPU 连续执行 14.6 ms");
  s += text(30,306,"10 ms 的步预算里砍掉 9 ms：36 → 68 tok/s（全程最大单笔）","#c65417",13.5,700);
  return s + "</svg>";
};
D.fusion = () => {
  let s = svgOpen(1040,260);
  for (let i=0;i<14;i++) s += box(30+i*40,30,32,36,"#c5c0ae","#504e42","","");
  s += text(620,54,"… × 26 个小 kernel","#8a8779",12.5,400);
  s += text(30,96,"每次发射 ~10 µs；中间结果写回显存再读回（一来一回双倍字节）","#504e42",13.5,400);
  s += arrow(470,112,470,142,"","#1c5d99");
  s += box(390,152,160,60,"#177a56","#fff","1 个融合 kernel","数据留在寄存器");
  s += text(30,244,"26 → 1：GDN 链 4.4 ms → 0.31 ms；发射消失、搬运消失、舍入还更准","#c65417",13.5,700);
  return s + "</svg>";
};
D.spec = () => {
  let s = svgOpen(1040,380);
  s += text(30,30,"① 草稿模型先猜 3 个（读的字节只有主模型的零头）","#171610",14.5,700);
  s += box(30,42,160,42,"#efece1","#171610","已确认：今天天气很","");
  const d=[["好","#eef2f7"],["，","#eef2f7"],["阳","#eef2f7"]];
  d.forEach((x,i)=>s+=box(210+i*92,42,82,42,x[1],"#171610","草稿 d"+(i+1)+"："+x[0],""));
  s += text(30,130,"② 目标模型一次前向验证 4 个位置（M=4：读一遍权重算 4 行）","#171610",14.5,700);
  s += box(30,142,160,42,"#efece1","#171610","目标 argmax：","好 ， 光…");
  s += box(210,142,82,42,"#e2efe7","#177a56","好 ✓","");
  s += box(302,142,82,42,"#e2efe7","#177a56","， ✓","");
  s += box(394,142,82,42,"#f6e3dd","#b3402e","阳 ✗","");
  s += box(486,142,96,42,"#efecf7","#6b5aa8","光 = 白拿","");
  s += text(30,226,"③ 接受前缀 n=2，白拿第 3 个 → 这一步产出 3 个 token（读一遍权重）","#171610",14.5,700);
  s += box(30,238,440,42,"#e2efe7","#177a56","提交：好 ， 光（输出与不用投机逐 token 相同）","");
  s += text(30,318,"速度 ≈ raw × 接受率 ÷ 验证倍率：101 × 3.08 ÷ 1.39 ≈ 224 tok/s","#c65417",14,700);
  s += text(30,350,"贪心下输出逐 token 相同 / 采样下分布精确相同——猜错只损失速度，不损失质量","#8a8779",13,400);
  return s + "</svg>";
};
D.verify = () => {
  let s = svgOpen(1040,310);
  s += text(30,30,"天真：8 行 = 8 次独立前向 = 8 × 14.3 GB","#b3402e",14.5,700);
  for (let i=0;i<8;i++) s += bar(30,44+i*24,64,18,"#f0e0d8","行"+(i+1));
  s += box(160,44,120,190,"#c5c0ae","#171610","权重矩阵","读 8 遍");
  s += text(500,30,"M 行 kernel / Marlin：读 1 遍 = 14.3 GB，8 行一起算","#177a56",14.5,700);
  for (let i=0;i<8;i++) s += bar(500,44+i*24,64,18,"#e2efe7","行"+(i+1));
  s += arrow(576,135,640,135,"","#177a56");
  s += box(650,78,130,114,"#177a56","#fff","一遍流式读","M=16 与 M=1 同价");
  s += arrow(790,135,850,135,"","#177a56");
  s += text(30,282,"“验证 7 个草稿只花 1.13 步”的硬件基础——权重反正要读一遍，多算几行近乎免费","#c65417",13.5,700);
  return s + "</svg>";
};
D.quant = () => {
  let s = svgOpen(1040,280);
  s += text(30,30,"bf16：每权重 16 bit → 26.9B 参数 = 53.8 GB","#171610",14.5,700);
  for (let i=0;i<16;i++) s += box(30+i*22,42,18,38,"#c5c0ae","#504e42","","");
  s += text(30,112,"int4 g128：每 128 个权重一组，4 bit 码 + 一对 bf16 的 scale / min","#171610",14.5,700);
  for (let i=0;i<4;i++) s += box(30+i*22,124,18,38,"#1c5d99","#fff","","");
  s += box(128,124,28,38,"#177a56","#fff","s","");
  s += box(160,124,28,38,"#9a7d2e","#fff","m","");
  s += text(210,150,"重建：w = q × s + m（q ∈ [-8, 7]）","#504e42",13.5,400);
  s += text(30,206,"体积 53.8 → 14.3 GB；墙上限 35 → 133 tok/s（A800）","#c65417",14,700);
  s += text(30,240,"质量：RTN 的 KL 0.055 → GPTQ+MSE 0.023；GSM8K 97.0% vs bf16 96.0%","#504e42",13.5,400);
  return s + "</svg>";
};
D.kv = () => {
  let s = svgOpen(1040,300);
  s += text(30,30,"每个 token 在 16 个注意力层留下的 K/V：bf16 64 KB · fp8 32 KB","#171610",14.5,700);
  const rows=[["1k 上下文",110],["32k 上下文",340],["200k 上下文",740]];
  rows.forEach((r,i)=>{
    s += text(30,64+i*72,r[0],"#504e42",12.5,400);
    s += bar(150,52+i*72,r[0]==="1k"?110:r[1],26,"#c8d6e5","bf16：64 / 2048 / 12800 MB");
    s += bar(150,84+i*72,r[0]==="1k"?55:r[1]/2,22,"#f0d6c4","fp8：一半");
  });
  s += text(30,288,"decode 每步都要把整个 KV 读一遍：长上下文的成本 = 容量 + 带宽，两头都是它","#8a8779",13,400);
  return s + "</svg>";
};
D.splitk = () => {
  let s = svgOpen(1040,310);

/* SVG 小工具 */
function svgOpen(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'; }
function box(x,y,w,h,fill,color,t1,t2){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+fill+'" stroke="#c5c0ae"/>'
   + (t1?'<text x="'+(x+w/2)+'" y="'+(y+h/2+(t2?-3:5))+'" font-size="13" font-weight="600" fill="'+color+'" text-anchor="middle">'+t1+'</text>':"")
   + (t2?'<text x="'+(x+w/2)+'" y="'+(y+h/2+15)+'" font-size="11.5" fill="'+color+'" text-anchor="middle">'+t2+'</text>':"");
}
function bar(x,y,w,h,fill,label){
  if (w<=0) w=1;
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+fill+'" stroke="#c5c0ae"/>'
   + (label?'<text x="'+(x+9)+'" y="'+(y+h/2+5)+'" font-size="12" fill="#504e42">'+label+'</text>':"");
}
function arrow(x1,y1,x2,y2,label,color){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="2.2" marker-end="url(#ah)"/>'
   + (label?'<text x="'+(x2+10)+'" y="'+(y2-9)+'" font-size="12" fill="'+color+'">'+label+'</text>':"");
}
function text(x,y,t,color,size,weight){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||13)+'" font-weight="'+(weight||400)+'" fill="'+(color||"#171610")+'">'+t+'</text>';
}

const dg = (fn,cap) => '<div class="diagram">'+DEFS+D[fn]()+'<div class="cap">'+cap+'</div></div>';

function refsBox(id){
  const r = CONCEPT_REFS[id]; if (!r || !r.length) return "";
  const docs = r.filter(x=>!String(x[1]).includes("bilibili"));
  const bilis = r.filter(x=>String(x[1]).includes("bilibili"));
  let h = '<div class="box refs"><div class="lab">参考资料（延伸阅读）</div>';
  if (docs.length) h += '<ol class="refs-list">'+docs.map(x=>
    '<li><a class="rt" href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+'</a><span class="rn">'+(x[2]||"")+'</span></li>').join("")+'</ol>';
  if (bilis.length) h += '<div class="lab" style="margin-top:10px">B 站视频（入口为搜索页；标题已核实存在）</div>'
   + '<ol class="refs-list bili">'+bilis.map(x=>

  return h + '</div>';
}

  g+='<text x="16" y="'+((pad.t+H-pad.b)/2)+'" font-size="12" fill="#504e42" text-anchor="middle" transform="rotate(-90 16 '+((pad.t+H-pad.b)/2)+')">tok/s</text>';

   + '<h1 style="font-family:var(--serif);font-size:clamp(30px,4vw,44px);font-weight:900;margin:8px 0 6px">参考资料总目</h1>'
   + '<p style="color:var(--ink2);max-width:760px">按概念课归组的论文、官方文档与博客（直链）＋B 站视频入口。B 站条目点开是搜索页——标注“核实存在”的标题都来自搜索确认；没有编造任何视频链接。</p></div>';
  for (const c of CONCEPTS){
    const r = CONCEPT_REFS[c.id]; if (!r || !r.length) continue;
    h += '<div style="margin:26px 0 8px"><a href="#/concept/'+c.id+'"><b style="font-family:var(--serif);font-size:19px">'+c.title+'</b></a></div>';
    h += '<ol class="refs-list" style="max-width:860px">'+r.filter(x=>!String(x[1]).includes("bilibili")).map(x=>
      '<li><a class="rt" href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+'</a><span class="rn">'+(x[2]||"")+'</span></li>').join("")+'</ol>';
    const b = r.filter(x=>String(x[1]).includes("bilibili"));
    if (b.length) h += '<ol class="refs-list bili" style="max-width:860px">'+b.map(x=>
      '<li><a class="rt" href="'+x[1]+'" target="_blank" rel="noopener">'+x[0].replace(/^B 站：/,"B 站（搜索）:")+'</a></li>').join("")+'</ol>';
  }
  app.innerHTML = h + '</div>'; window.scrollTo(0,0);
}

   + '<div class="kicker">STUDY PLAN · 四周</div>'
   + '<h1 style="font-family:var(--serif);font-size:clamp(30px,4vw,44px);font-weight:900;margin:8px 0 6px">学习路径建议</h1></div>'
   + '<div style="max-width:900px;padding-bottom:20px">'

   + '<li>步骤课：<a href="#/step/1">第 1 课</a>（立墙）、<a href="#/step/2">第 2 课</a>（为什么慢得离谱）、<a href="#/step/4">第 4 课</a>（CUDA graph）</li>'

   + '<li>概念课：<a href="#/concept/launch">启动开销</a> → <a href="#/concept/fusion">融合</a> → <a href="#/concept/gemv">GEMV/M 行</a> → <a href="#/concept/flashdec">flash decoding</a> → <a href="#/concept/l2">L2 陷阱</a></li>'
   + '<li>步骤课：第 3、6、7、8、11 课；作业：L2-proof 扫描（第 11 课 A800 栏）</li></ol></div>'
   + '<div class="pathbox"><b>第三周 · 投机的世界（阶段三，项目的高潮）</b><ol>'
   + '<li>概念课：<a href="#/concept/spec">投机解码</a> → <a href="#/concept/verify">验证步</a> → <a href="#/concept/mtp">MTP</a> → <a href="#/concept/dflash">DFlash2</a> → <a href="#/concept/marlin">Marlin</a></li>'
   + '<li>步骤课：12、13、14、23（负结果！）、24、28 课</li>'

   + '<div class="pathbox"><b>第四周起 · A800 重调（我们的主线）</b><ol>'
   + '<li>每课的“在 A800 上”栏就是作业清单：split-K 段数、num_stages、BV、Marlin 的 L2 evict 提示（sm_80 合法！）</li>'
   + '<li>毕业考：第 32 课的纪律——同日重锚墙、复测 raw / 投机 / 上下文曲线，写进 docs/a800.md</li></ol></div>'
   + '</div></div>';

function route(){
  const h = location.hash || "#/";
  if (h.startsWith("#/step/")) pageStep(parseInt(h.split("/")[2],10));
  else if (h.startsWith("#/concept/")) pageConcept(h.split("/")[2]);
  else if (h === "#/concepts") pageConcepts();
  else if (h === "#/path") pagePath();
  else if (h === "#/refs") pageRefs();
  else pageHome();
}
window.addEventListener("hashchange", route);
route();
</script>
